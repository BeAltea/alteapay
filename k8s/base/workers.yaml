apiVersion: apps/v1
kind: Deployment
metadata:
  name: alteapay-workers
  namespace: alteapay-app
  labels: { app: alteapay-workers, tier: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: alteapay-workers } }
  template:
    metadata: { labels: { app: alteapay-workers, tier: worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001 }
      containers:
        - name: workers
          image: alteapay/app:local
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "lib/queue/start-workers.ts"]
          envFrom:
            - secretRef: { name: alteapay-app-secrets }
            - configMapRef: { name: alteapay-app-config }
          ports: [{ containerPort: 3001 }]
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: alteapay-workers, namespace: alteapay-app }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: alteapay-workers } }
