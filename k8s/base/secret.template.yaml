  ASAAS_API_KEY: ""
  ASAAS_WEBHOOK_TOKEN: "PLACEHOLDER"
  SENDGRID_API_KEY: ""
  # HMAC do webhook n8n (/api/webhooks/n8n) — mesmo valor configurado nos
